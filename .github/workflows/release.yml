name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install frontend deps
        working-directory: assets
        run: npm ci --ignore-scripts

      - name: Fetch existing tags
        run: git fetch --force --tags origin

      - name: Build frontend
        working-directory: assets
        run: npm run build

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit built assets
        run: |
          git add -f public/build
          if git diff --cached --quiet; then
            echo "No build changes to commit."
            exit 0
          fi
          git commit -m "Build assets for ${{ github.ref_name }}"

      - name: Force-update tag
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          # Reuse the annotator's message as the release title and notes. Ignore a message
          # left behind by a previous CI build commit so re-runs stay stable.
          MSG="$(git for-each-ref --format='%(contents)' "refs/tags/$TAG" | sed -e 's/[[:space:]]*$//')"
          if printf '%s\n' "$MSG" | head -n1 | grep -q '^Build assets for '; then MSG=""; fi
          if [ -z "$MSG" ]; then MSG="$TAG"; fi
          TITLE="$(printf '%s\n' "$MSG" | head -n1)"
          BODY="$(printf '%s\n' "$MSG" | tail -n +2 | sed -e '/./,$!d')"
          {
            echo "title=$TITLE"
            echo 'body<<RELEASE_NOTES_EOF'
            printf '%s\n' "$BODY"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          git tag -f -a "$TAG" -m "$MSG" HEAD
          git push --force origin "refs/tags/$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.tag.outputs.title }}
          BODY: ${{ steps.tag.outputs.body }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "$TITLE" --notes "$BODY"
          elif [ -n "$BODY" ]; then
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TITLE" --notes "$BODY"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TITLE" --generate-notes
          fi
