services:
    _defaults:
        autowire: true
        autoconfigure: true

    Watza\CommandCenterBundle\Service\:
        resource: '../src/Service/'

    Watza\CommandCenterBundle\Controller\:
        resource: '../src/Controller/'
        public: true
        tags: ['controller.service_arguments']

    Watza\CommandCenterBundle\Scheduler\CommandCenter\ScheduleProvider: ~
    Watza\CommandCenterBundle\Scheduler\CommandCenter\RunSchedulesHandler: ~

    Watza\CommandCenterBundle\Webpack\WebpackEntryPointProvider:
        tags: ['pimcore_studio_ui.webpack_entry_point_provider']
